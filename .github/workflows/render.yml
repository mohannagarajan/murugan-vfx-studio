name: Render AI Cinematic VFX Video
on:
  workflow_dispatch:

jobs:
  build-vfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install gdown faster-whisper requests pillow numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate

      - name: Install Remotion dependencies
        run: npm install

      - name: Run AI Story-to-VFX Pipeline
        run: python pipeline.py

      - name: Render 60fps Cinematic Video
        run: npx remotion render src/index.ts VfxScene out/cinematic_vfx.mp4 --fps=60 --codec=h264

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: murugan-cinematic-vfx
          path: out/cinematic_vfx.mp4
          
