name: 100% AI Text-to-Video Automation
on:
  workflow_dispatch:
    inputs:
      tamil_story:
        description: 'Tamil Story Script (Optional - uses default Palani Murugan story if empty)'
        required: false
        default: ''

jobs:
  generate-ai-video:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          pip install --upgrade pip
          pip install huggingface_hub edge-tts faster-whisper gdown requests pillow

      - name: Run 100% AI Video & Voice Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STORY_INPUT: ${{ github.event.inputs.tamil_story }}
        run: python pipeline.py

      - name: Upload Final AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-cinematic-story-video
          path: out/final_ai_video.mp4
          
